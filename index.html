<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="A fun interactive Valentine's Day question" />
  <title>Will You Be My Valentine?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <div class="content">
      <h1 class="title">Will you be my Valentine?</h1>
      <div class="buttons" role="group" aria-label="Response buttons">
        <button class="btn btn--yes" aria-label="Accept">Yes 💖</button>
        <button class="btn btn--no" aria-label="Decline">No 🙈</button>
      </div>
      </div>
  </main>
  <script src="script.js"></script>
</body>
</html>

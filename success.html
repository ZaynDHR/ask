<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Valentine's Day acceptance" />
  <title>I Knew It! 😍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-primary: #ff4f81;
      --color-bg-from: #ffe6f0;
      --color-bg-to: #fbeaff;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--color-bg-from), var(--color-bg-to));
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 1rem;
      color: #333;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    main.container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .message {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 700;
      color: var(--color-primary);
      animation: bounce-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      line-height: 1.2;
    }

    .hearts {
      font-size: 3rem;
      animation: float 3s ease-in-out infinite;
    }

    .btn-back {
      padding: 0.875rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
      display: inline-block;
      font-family: inherit;
      outline-offset: 2px;
    }

    .btn-back:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 25px rgba(255, 105, 135, 0.3);
    }

    .btn-back:focus-visible {
      outline: 2px solid var(--color-primary);
    }

    @keyframes bounce-in {
      0% {
        opacity: 0;
        transform: scale(0.3);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 640px) {
      .message {
        font-size: 2.5rem;
      }

      .hearts {
        font-size: 2rem;
      }

      .btn-back {
        width: 100%;
        padding: 0.75rem 1.5rem;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: linear-gradient(135deg, #4a1a2e, #6b2d5c);
      }

      .message {
        color: #ff8fa3;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="content">
      <div class="message">I knew it! 😍</div>
      <div class="hearts">💖 💕 💗</div>
      <a href="index.html" class="btn-back">Go Back</a>
    </div>
  </main>
</body>
</html>
